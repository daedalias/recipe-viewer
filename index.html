<!DOCTYPE html>

<html>

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1">

<title>
    Recipe Viewer 
</title>

<link
    rel="stylesheet"
    href="style.css">

</head>

<body>

<div id="listView">

    <h1>
        Recipe Viewer v4
    </h1>

    <input
        type="file"
        id="filePicker"
        accept=".json">

    <input
        type="search"
        id="searchBar"
        placeholder="Search Recipes">
<select id="categoryFilter">
    <option value="">
        All Categories
    </option>
</select>

<select id="tagFilter">
    <option value="">
        All Tags
    </option>
</select>

<label>

    <input
        type="checkbox"
        id="favoritesOnly">

    Favorites Only

</label>

<button id="clearFilters">
    Clear Filters
</button>
    <div id="recipeCount">
        Recipes: 0
    </div>

    <div id="recipeList">
    </div>

</div>

<div
    id="detailView"
    style="display:none;">

    <button id="backButton">
        ← Back
    </button>

    <div id="recipeDetail">
    </div>

</div>

<script src="app.js"></script>

</body>

</html>
