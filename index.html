<!DOCTYPE html>

<html>

<head>

<meta
    charset="utf-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1">

<title>
    Recipe Viewer Test
</title>

<style>

body {
    background: #663300;
    color: white;
    font-family: sans-serif;
    padding: 20px;
}

button {
    padding: 12px;
    font-size: 18px;
}

</style>

</head>

<body>

<h1>
    Recipe Viewer Test
</h1>

<button id="testButton">
    Test JavaScript
</button>

<script>

document
    .getElementById(
        "testButton"
    )
    .addEventListener(
        "click",
        () => {

            alert(
                "JavaScript Works"
            );

        }
    );

</script>

</body>

</html>
