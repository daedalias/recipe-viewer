<!DOCTYPE html>

<html>

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1">

<title>
    Recipe Viewer 
</title>

<link
    rel="stylesheet"
    href="style.css">

</head>

<body>

<div id="listView">

    <h1>
        Recipe Viewer v10
    </h1>

    <input
        type="file"
        id="filePicker"
        accept=".json">

    <input
        type="search"
        id="searchBar"
        placeholder="Search Recipes">
<select id="categoryFilter">
    <option value="">
        All Categories
    </option>
</select>

<select id="tagFilter">
    <option value="">
        All Tags
    </option>
</select>

<label>

    <input
        type="checkbox"
        id="favoritesOnly">

    Favorites Only

</label>

<button id="clearFilters">
    Clear Filters
</button>
    <div id="recipeCount">
        Recipes: 0
    </div>

    <div id="recipeList">
    </div>

</div>

<div
    id="detailView"
    style="display:none;">

 <div class="detailHeader">

    <button id="backButton">
        ← Back
    </button>

    <button id="cookModeButton">
        🍳 Cook
    </button>

</div>

    <div id="recipeDetail">
    </div>

</div>
<div
    id="cookModeView"
    style="display:none;">

    <div class="detailHeader">

        <button id="exitCookMode">
            Done
        </button>

    </div>

    <h1 id="cookRecipeTitle">
    </h1>

    <div class="cookTabs">

        <button id="ingredientsTab">
            Ingredients
        </button>

        <button id="stepsTab">
            Steps
        </button>

    </div>

    <div id="cookIngredients">
    </div>

    <button id="clearChecks">
        Clear Checks
    </button>

    <div
        id="cookSteps"
        style="display:none;">

        <div id="stepCounter">
        </div>

        <div id="stepText">
        </div>

        <div class="stepButtons">

            <button id="previousStep">
                Previous
            </button>

            <button id="nextStep">
                Next
            </button>

        </div>

    </div>

</div>
<script src="app.js"></script>

</body>

</html>
